[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-storage",
    "crates/engine-gateway",
    "crates/wasmpulse-cli",
]
exclude = [
    "examples/rust-echo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["WasmPulse Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
wasmtime = "25.0"
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }
bytes = "1.6"
tower-http = { version = "0.5", features = ["cors", "trace"] }
